name: Source checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Core and bilingual checks
        shell: pwsh
        run: ./tests/run.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'jianvault-tests')
      - name: Release publisher integration checks
        shell: pwsh
        run: ./tests/publish-release.tests.ps1
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Compile developer APK without release secrets
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
