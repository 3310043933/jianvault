name: Source checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Core and bilingual checks
        shell: pwsh
        run: ./tests/run.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'jianvault-tests')
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile developer APK without release secrets
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
